title: Omni_report
author: Albert Rapp
version: 1.0.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    typst:
      toc: true
      toc-title: "Table of Contents"
      contact-email: projects@omni.org
      start-page-number: 1
      shift-heading-level-by: 0
      use-csi-style: false
      template: template.typ
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - pages.typ
        - design_elements.typ
      filters:
        - filter.lua
    html:
      toc: true
      toc-location: left
      format-links: false
      # Shown in the page footer next to the copyright line.
      contact-email: projects@omni.org
      # Swaps the header logo (and its height) and the default organization
      # name to the CSI (Center for Social Investment) branding. See filter.lua.
      use-csi-style: false

      # `default` picks the header logo's height from the logo file
      # (logo-ref); set a CSS length (e.g. "44px") to override it directly.
      logo-height: default

      # Hide "Footnotes" text
      language:
        section-title-footnotes: ""
      # appendix-style: none
      template-partials:
        - title-block.html
      theme:
        - colors.scss
        - frontmatter.scss
      filters:
        - filter.lua
